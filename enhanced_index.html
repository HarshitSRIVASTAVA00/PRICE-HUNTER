<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Smart Price Hunter - Enhanced Real Scraping</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header p {
            font-size: 1.2rem;
            color: #b8b8b8;
            margin-bottom: 10px;
        }

        .badge {
            background: linear-gradient(45deg, #06ffa5, #48cae4);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
        }

        .search-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .site-checkbox {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .site-checkbox:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .site-checkbox.checked {
            border-color: #4ecdc4;
            background: rgba(78, 205, 196, 0.1);
        }

        .site-checkbox input {
            display: none;
        }

        .site-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            position: relative;
            transition: all 0.3s ease;
        }

        .site-checkbox.checked .custom-checkbox {
            background: #4ecdc4;
            border-color: #4ecdc4;
        }

        .custom-checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .site-checkbox.checked .custom-checkbox::after {
            opacity: 1;
        }

        .site-label {
            font-weight: 600;
            font-size: 1rem;
        }

        .search-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #45b7d1);
            width: 0%;
            transition: width 0.5s ease;
        }

        .agent-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .agent-card {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .agent-running { background: rgba(255, 193, 7, 0.2); }
        .agent-completed { background: rgba(40, 167, 69, 0.2); }
        .agent-failed { background: rgba(220, 53, 69, 0.2); }

        .results-content {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #4ecdc4;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #b8b8b8;
            font-weight: 600;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .product-card.best-deal {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .best-deal-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #fff;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #4ecdc4;
            margin-bottom: 8px;
        }

        .price-details {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .original-price {
            text-decoration: line-through;
            color: #888;
            font-size: 0.9rem;
        }

        .savings {
            background: rgba(6, 255, 165, 0.2);
            color: #06ffa5;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .product-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .rating {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .discount-badge {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .product-site {
            color: #b8b8b8;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-link {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .product-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
            text-decoration: none;
            color: white;
        }

        /* Site-specific link colors */
        .product-card[data-site="Amazon India"] .product-link {
            background: linear-gradient(45deg, #ff9500, #ff6d00);
        }

        .product-card[data-site="Flipkart"] .product-link {
            background: linear-gradient(45deg, #2874f0, #1565c0);
        }

        .product-card[data-site="Myntra"] .product-link {
            background: linear-gradient(45deg, #ff3f6c, #e91e63);
        }

        .product-card[data-site="Snapdeal"] .product-link {
            background: linear-gradient(45deg, #e53e3e, #c53030);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .search-card, .results-card {
                padding: 25px;
            }

            .sites-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Smart Price Hunter</h1>
            <p>Enhanced Real Web Scraping with Images & Links</p>
            <div class="badge">REAL DATA + REAL IMAGES + REAL LINKS</div>
        </div>

        <div class="search-card">
            <form id="searchForm">
                <div class="form-group">
                    <label>🔍 Search Product</label>
                    <input type="text" id="product" class="search-input" placeholder="e.g., iPhone 15, Samsung TV, Adidas shoes" required>
                </div>
                
                <div class="form-group">
                    <label>🏪 Select Sites to Scrape</label>
                    <div class="sites-grid">
                        <label class="site-checkbox">
                            <input type="checkbox" name="sites" value="amazon" checked>
                            <div class="site-content">
                                <div class="custom-checkbox"></div>
                                <span class="site-label">🛒 Amazon India</span>
                            </div>
                        </label>
                        <label class="site-checkbox">
                            <input type="checkbox" name="sites" value="flipkart" checked>
                            <div class="site-content">
                                <div class="custom-checkbox"></div>
                                <span class="site-label">🛍️ Flipkart</span>
                            </div>
                        </label>
                        <label class="site-checkbox">
                            <input type="checkbox" name="sites" value="myntra">
                            <div class="site-content">
                                <div class="custom-checkbox"></div>
                                <span class="site-label">👗 Myntra</span>
                            </div>
                        </label>
                        <label class="site-checkbox">
                            <input type="checkbox" name="sites" value="snapdeal" checked>
                            <div class="site-content">
                                <div class="custom-checkbox"></div>
                                <span class="site-label">💰 Snapdeal</span>
                            </div>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="search-btn" id="searchBtn">
                    🕸️ Start Web Scraping
                </button>
            </form>
        </div>

        <div id="resultsCard" class="results-card">
            <div id="loadingDiv" class="loading">
                <div class="spinner"></div>
                <h3 id="loadingTitle">🕸️ Web Scraping Active</h3>
                <p id="loadingSubtitle">Scraping real product data...</p>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="agentStatus" class="agent-status"></div>
            </div>

            <div id="resultsContent" class="results-content">
                <h2 style="text-align: center; margin-bottom: 30px; color: #4ecdc4;">🎯 Scraping Results</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="totalProducts">0</h3>
                        <p>Products Found</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="bestPrice">₹0</h3>
                        <p>Best Price</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="totalSavings">₹0</h3>
                        <p>Total Savings</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="sitesCount">0</h3>
                        <p>Sites Scraped</p>
                    </div>
                </div>

                <div id="productGrid" class="products-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentSearchId = null;
        let statusInterval = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
        });

        function setupEventListeners() {
            // Checkbox functionality
            document.querySelectorAll('.site-checkbox input').forEach(cb => {
                cb.addEventListener('change', function() {
                    this.closest('.site-checkbox').classList.toggle('checked', this.checked);
                });
                if (cb.checked) cb.closest('.site-checkbox').classList.add('checked');
            });

            // Form submission
            document.getElementById('searchForm').addEventListener('submit', handleFormSubmit);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const data = new FormData(e.target);
            const product = data.get('product');
            const sites = data.getAll('sites');
            
            if (!sites.length) {
                alert('⚠️ Please select at least one site!');
                return;
            }
            
            startSearch(product, sites);
        }

        async function startSearch(product, sites) {
            document.getElementById('resultsCard').style.display = 'block';
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('resultsContent').style.display = 'none';
            
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = '🕸️ Web Scraping...';
            
            // Scroll to results
            document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth' });
            
            try {
                const response = await fetch(`${API_BASE}/compare`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product, sites })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                currentSearchId = result.search_id;
                
                pollStatus();
                
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to start web scraping');
                resetButton();
            }
        }

        async function pollStatus() {
            if (!currentSearchId) return;
            
            try {
                const response = await fetch(`${API_BASE}/status/${currentSearchId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const status = await response.json();
                updateProgress(status);
                
                if (status.status === 'completed') {
                    clearTimeout(statusInterval);
                    await fetchResults();
                } else if (status.status === 'failed') {
                    clearTimeout(statusInterval);
                    showError('Web scraping failed');
                    resetButton();
                } else {
                    statusInterval = setTimeout(pollStatus, 1000);
                }
            } catch (error) {
                console.error('Polling error:', error);
                clearTimeout(statusInterval);
                showError('Connection error');
                resetButton();
            }
        }

        function updateProgress(status) {
            document.getElementById('progressFill').style.width = `${status.progress || 0}%`;
            
            const title = document.getElementById('loadingTitle');
            const subtitle = document.getElementById('loadingSubtitle');
            
            title.textContent = `🕸️ Web Scraping (${status.agents_completed || 0}/${status.total_agents || 0})`;
            subtitle.textContent = `Progress: ${Math.round(status.progress || 0)}% | Duration: ${Math.round(status.duration || 0)}s`;
            
            // Update agent statuses
            const agentHTML = Object.entries(status.agent_statuses || {})
                .map(([site, info]) => {
                    const statusClass = `agent-${info.status}`;
                    const icon = { running: '🔄', completed: '✅', failed: '❌' }[info.status] || '🔄';
                    return `<div class="agent-card ${statusClass}">
                        <div>${icon} ${site}</div>
                        <div>Products: ${info.products_found || 0}</div>
                    </div>`;
                }).join('');
            document.getElementById('agentStatus').innerHTML = agentHTML;
        }

        async function fetchResults() {
            try {
                const response = await fetch(`${API_BASE}/results/${currentSearchId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const results = await response.json();
                displayResults(results);
                resetButton();
                
            } catch (error) {
                console.error('Results error:', error);
                showError('Failed to fetch results');
                resetButton();
            }
        }

        function displayResults(results) {
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('resultsContent').style.display = 'block';
            
            const products = results.products || [];
            
            if (!products.length) {
                document.getElementById('productGrid').innerHTML = 
                    '<div style="text-align:center;color:#b8b8b8;"><h3>No products found. Try different search terms.</h3></div>';
                return;
            }

            updateStats(results);
            renderProducts(products);
        }

        function updateStats(results) {
            const products = results.products || [];
            const availableProducts = products.filter(p => p.available);
            const prices = availableProducts.map(p => p.price);
            
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('bestPrice').textContent = prices.length ? 
                `₹${Math.min(...prices).toLocaleString()}` : '₹0';
            document.getElementById('totalSavings').textContent = 
                `₹${products.reduce((sum, p) => sum + (p.savings || 0), 0).toLocaleString()}`;
            document.getElementById('sitesCount').textContent = 
                [...new Set(products.map(p => p.site))].length;
        }

        function renderProducts(products) {
            const availablePrices = products.filter(p => p.available).map(p => p.price);
            const bestPrice = availablePrices.length ? Math.min(...availablePrices) : 0;
            
            const productsHTML = products.map(product => {
                const isBestDeal = product.available && product.price === bestPrice;
                const rating = product.rating || 0;
                
                return `
                    <div class="product-card ${isBestDeal ? 'best-deal' : ''}" data-site="${product.site}">
                        ${isBestDeal ? '<div class="best-deal-badge">🏆 BEST DEAL</div>' : ''}
                        
                        <img src="${product.image_url}" alt="${product.name}" class="product-image" 
                             onerror="this.src='https://via.placeholder.com/300x200/4ecdc4/ffffff?text=No+Image'">
                        
                        <div class="product-name">${product.name}</div>
                        
                        <div class="product-price">₹${product.price.toLocaleString()}</div>
                        
                        <div class="price-details">
                            ${product.original_price && product.original_price > product.price ? 
                                `<span class="original-price">₹${product.original_price.toLocaleString()}</span>` : ''}
                            ${product.savings > 0 ? 
                                `<span class="savings">Save ₹${product.savings.toLocaleString()}</span>` : ''}
                        </div>
                        
                        <div class="product-meta">
                            ${rating > 0 ? `<span class="rating">⭐ ${rating} (${product.review_count || 0})</span>` : ''}
                            ${product.discount_percentage > 0 ? 
                                `<span class="discount-badge">${product.discount_percentage}% OFF</span>` : ''}
                        </div>
                        
                        <div class="product-site">📍 ${product.site}</div>
                        
                        <a href="${product.product_url || '#'}" target="_blank" class="product-link" rel="noopener noreferrer">
                            🔗 View on ${product.site}
                        </a>
                    </div>
                `;
            }).join('');

            document.getElementById('productGrid').innerHTML = productsHTML;
        }

        function showError(message) {
            document.getElementById('loadingDiv').innerHTML = `
                <div style="text-align:center;color:#ff6b6b;">
                    <h3>❌ ${message}</h3>
                    <p>Please try again</p>
                    <button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#4ecdc4;color:white;border:none;border-radius:10px;cursor:pointer;">🔄 Reload Page</button>
                </div>`;
        }

        function resetButton() {
            const btn = document.getElementById('searchBtn');
            btn.disabled = false;
            btn.textContent = '🕸️ Start Web Scraping';
        }
    </script>
</body>
</html>
